<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Drop Box</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 0 16px; text-align: center; }
        .notice { font-size: 0.85em; color: #444; text-align: left; border: 1px solid #ccc; padding: 12px 16px; margin: 20px 0; }
        .notice ul { padding-left: 1.2em; margin: 8px 0 0; }
    </style>
</head>
<body>
    <h2>画像送信ツール</h2>
    <p>以下のフォームから画像を送信してください。</p>

    <!-- 記録内容・利用目的は送信前に表示する（プライバシー通知） -->
    <div class="notice">
        <strong>送信前にご確認ください</strong>
        <ul>
            <li>記録する情報: 送信者のIPアドレス、IPから推定した地域、端末・ブラウザ情報（User-Agent）、回線種別の推定値、送信日時</li>
            <li>利用目的: 不正利用の防止およびサーバー管理のため</li>
            <li>保存期間: 〇〇日間（経過後に削除）</li>
            <li>上記情報を第三者へ提供することはありません</li>
            <li>画像に含まれる位置情報（Exif）等もそのまま保存されます。必要に応じて削除してから送信してください</li>
        </ul>
    </div>

    <form method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/png,image/jpeg,image/gif,image/webp" required>
        <input type="hidden" name="net_type" id="net_type">
        <input type="hidden" name="net_downlink" id="net_downlink">
        <br><br>
        <label><input type="checkbox" required> 上記の内容に同意して送信します</label>
        <br><br>
        <button type="submit">送信する</button>
    </form>

    <script src="{{ url_for('static', filename='network-info.js') }}"></script>
</body>
</html>
